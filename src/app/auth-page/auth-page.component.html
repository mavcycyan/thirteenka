<div class="auth-page">
    <div class="auth-page-container">
        <div class="auth-page-tabs">
            <ul>
                <li>
                    <a [routerLink]="['login']" class="btn-large waves-effect waves-light" [ngClass]="{amber: isLogin, grey: !isLogin}" routerLinkActive="active" (click)="checkPage('login')">Sign In</a>
                </li>
                <li>
                    <a [routerLink]="['register']" class="btn-large waves-effect waves-light" [ngClass]="{amber: !isLogin, grey: isLogin}" routerLinkActive="active" (click)="checkPage('register')">Sign Up</a>
                </li>
            </ul>
        </div>
        <div class="auth-page-form">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
