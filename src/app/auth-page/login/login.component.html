<form [formGroup]="loginForm" (submit)="onSubmit()" class="form">
    <div *ngIf="errors" class="form-serv-error">
        {{errors}}
    </div>
    <div class="form-input">
        <label for="">E-mail</label>
        <input type="text" formControlName="email">
    </div>
    <div class="form-input">
        <label for="">Password</label>
        <input type="password" formControlName="password">
    </div>
    <div class="form-btn">
        <button type="submit" class="btn-large waves-effect waves-light brown">Submit</button>
    </div>
</form>
