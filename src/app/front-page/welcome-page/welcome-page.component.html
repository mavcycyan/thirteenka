<div class="comp_welc">
    <div class="comp_welc-user">
        {{ user | titlecase }}
    </div>
    <div class="comp_welc-time">
        {{ today | date:'HH:mm:ss' }}
    </div>
    <div class="comp_welc-info">
        <div class="comp_welc-info-bl">
            <div class="comp_welc-info-bl-txt"></div>
            <div class="comp_welc-info-bl-graph">
                <canvas #gstart></canvas>
            </div>
        </div>
        <div class="comp_welc-info-bl">
            <div class="comp_welc-info-bl-txt"></div>
            <div class="comp_welc-info-bl-graph">
                <canvas #gend></canvas>
            </div>
        </div>
    </div>
</div>
