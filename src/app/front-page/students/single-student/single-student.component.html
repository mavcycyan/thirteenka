<form class="form stud-form" (submit)="onSubmit()" [formGroup]="studForm">
    <div *ngIf="errors" class="form-serv-error">
        {{errors}}
    </div>
    <div class="form-input full">
        <label>Surname</label>
        <input type="text" name="surname" placeholder="Surname" formControlName="surname">
    </div>
    <div class="form-input">
        <label>First name</label>
        <input type="text" name="first-name" placeholder="First name" formControlName="firstName">
    </div>
    <div class="form-input">
        <label>Patronymic</label>
        <input type="text" name="patronymic" placeholder="Patronymic" formControlName="patronymic">
    </div>
    <div class="form-input">
        <label>Birthday</label>
        <input type="date" name="birthday" placeholder="Birthday" formControlName="birthday" >
    </div>
    <div class="form-input">
        <label>Citizenship</label>
        <input type="text" name="citizenship" placeholder="Citizenship" formControlName="citizenship">
    </div>
    <div class="form-input">
        <label>Native City</label>
        <input type="text" name="nativeCity" placeholder="Native City" formControlName="nativeCity">
    </div>
    <div class="form-input">
        <label>Address</label>
        <input type="text" name="address" placeholder="Address" formControlName="address">
    </div>
    <div class="form-input">
        <label>School Finished</label>
        <input type="text" name="schoolFinished" placeholder="School Finished" formControlName="schoolFinished">
    </div>
    <div class="form-input">
        <label>Chair</label>
        <select name="chair" formControlName="chair" (change)="changeChair($event)" style="display: block;">
            <option value="" disabled>Chair</option>
            <option *ngFor="let chair of chairList" [value]="chair._id">{{chair.name}}</option>
        </select>
    </div>
    <div class="form-input">
        <label>Speciality</label>
        <select name="speciality" formControlName="speciality" (change)="changeSpec($event)" style="display: block;">
            <option value="" disabled>Speciality</option>
            <option *ngFor="let spec of specList" [value]="spec._id">{{spec.name}}</option>
        </select>
    </div>
    <div class="form-input">
        <label>Group</label>
        <input type="text" name="group" placeholder="Group" formControlName="group">
    </div>
    <div class="form-input">
        <label>Educ Form</label>
        <input type="text" name="educForm" placeholder="Educ Form" formControlName="educForm">
    </div>
    <div class="form-input">
        <label>Curator</label>
        <input type="text" name="curator" placeholder="Curator" formControlName="curator">
    </div>
    <div class="form-input">
        <label>Degree</label>
        <select id="degree" name="degree" formControlName="degree">
            <option value="" selected>Degree</option>
            <option value="Bachelor">Bachelor</option>
            <option value="Specialist">Specialist</option>
            <option value="Graduate student">Graduate student</option>
        </select>
    </div>
    <div class="form-input">
        <label>Year Start</label>
        <select id="yearStart" name="yearStart" formControlName="yearStart">
            <option value="0"></option>
            <option *ngFor="let year of edYears" [value]="year">{{year}}</option>
        </select>
    </div>
    <div class="form-input">
        <label>Year End</label>
        <select id="yearEnd" name="yearEnd" formControlName="yearEnd">
            <option value="0"></option>
            <option *ngFor="let year of edYears" [value]="year">{{year}}</option>
        </select>
    </div>
    <div class="form-input">
        <label>Status</label>
        <select id="status" name="status" formControlName="status">
            <option value="" selected>Status</option>
            <option value="Studying">Studying</option>
            <option value="Free">Free</option>
        </select>
    </div>
    <div class="form-input">
        <label>Budget</label>
        <select name="budget" formControlName="budget">
            <option value="" selected></option>
            <option value="false">No</option>
            <option value="true">Yes</option>
        </select>
    </div>
    <div class="form-input">
        <label>Scholarship</label>
        <select name="scholarship" formControlName="scholarship">
            <option value="" selected></option>
            <option value="false">No</option>
            <option value="true">Yes</option>
        </select>
    </div>
    <div class="single_student-btns">
        <button type="submit" class="btn-large waves-effect waves-light green">{{addUpdTxt}}</button>
        <button type="button" *ngIf="isUpd" class="btn-large waves-effect waves-light red" (click)="showModal(rm_stud)">Remove</button>
    </div>
</form>

<div id="remove_stud" class="modal" #rm_stud>
    <div class="modal-content">
        <h4>You are deleting student</h4>
        <p>Are you sure ?</p>
    </div>
    <div class="modal-footer">
        <button (click)="removeStudent(studId)" class="modal-close waves-effect waves-green btn-flat">Agree</button>
    </div>
</div>
