<div class="filter">
    <div class="filter-row">
        <div class="filter-bl full">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" (keyup)="nameFilt(nameInp.value)" #nameInp>
        </div>
        <div class="filter-bl quat">
            <label for="chair">Chair</label>
            <select id="chair" (change)="chairFilt({type: 'chair', value: chairSel})" [(ngModel)]="chairSel" >
                <option value="" selected>Chair</option>
                <option *ngFor="let chair of chairs;" [value]="chair._id" >{{chair.name}}</option>
            </select>
        </div>
        <div class="filter-bl quat">
            <label for="speciality">Speciality</label>
            <select id="speciality" (change)="sendParam({type: 'speciality', value: specSel})" [(ngModel)]="specSel">
                <option value="" selected>Speciality</option>
                <option *ngFor="let special of specializations;" [value]="special._id" >{{special.name}}</option>
            </select>
        </div>
        <div class="filter-bl quat">
            <label for="group">Group</label>
            <select id="group">
                <option value="" selected>Group</option>
            </select>
        </div>
        <div class="filter-bl quat">
            <label for="degree">Degree</label>
            <select id="degree" (change)="sendParam({type: 'degree', value: degrSel})" [(ngModel)]="degrSel">
                <option value="" selected>Degree</option>
                <option value="Bachelor">Bachelor</option>
                <option value="Specialist">Specialist</option>
                <option value="Graduate student">Graduate student</option>
            </select>
        </div>
        <div class="filter-bl full"></div>
        <div class="filter-bl quat">
            <label for="ed_start">Education start</label>
            <select name="" id="ed_start" (change)="sendParam({type: 'yearStart', value: yearStartSel})" [(ngModel)]="yearStartSel">
                <option value="0"></option>
                <option *ngFor="let year of edYears" [value]="year">{{year}}</option>
            </select>
        </div>
        <div class="filter-bl quat">
            <label for="ed_end">Education end</label>
            <select name="" id="ed_end" (change)="sendParam({type: 'yearEnd', value: yearEndSel})" [(ngModel)]="yearEndSel">
                <option value="0"></option>
                <option *ngFor="let year of edYears" [value]="year">{{year}}</option>
            </select>
        </div>
        <div class="filter-bl quat">
            <label for="budg">Has budget</label>
            <select id="budg" (change)="sendParam({type: 'budget', value: budgSel})" [(ngModel)]="budgSel">
                <option value="" selected></option>
                <option value="false">No</option>
                <option value="true">Yes</option>
            </select>
        </div>
        <div class="filter-bl quat">
            <label for="schol">Scholarship</label>
            <select id="schol" (change)="sendParam({type: 'scholarship', value: schSel})" [(ngModel)]="schSel">
                <option value="" selected></option>
                <option value="false">No</option>
                <option value="true">Yes</option>
            </select>
        </div>
        <div class="filter-bl quat">
            <button type="button" class="btn-small waves-effect waves-light red" (click)="remAll()">remove all</button>
        </div>
    </div>
</div>
