<div class="students">
    <div class="students-top">
        <div class="students-top-col">
            <button>Filters</button>
        </div>
        <div class="students-top-col">
            <a [routerLink]="['add']">Add new student</a>
        </div>
    </div>
    <div class="students-form">
        <form action="">
        </form>
    </div>
    <div class="students-list">
        <div *ngFor="let stud of students; let i = index;">
            <a [routerLink]="['edit', stud._id]" class="students-list-row is-stud">
                <span class="students-list-num">{{ i+1 }}</span>
                <span class="students-list-fio">{{stud.surname}} {{stud.firstName}}</span>
                <span class="students-list-living_city">{{stud.citizenship}}</span>
                <span class="students-list-chair">{{stud.chair}}</span>
                <span class="students-list-fac">{{stud.faculty}}</span>
                <span class="students-list-group">{{stud.group}}</span>
                <span class="students-list-degree">{{stud.degree}}</span>
                <span class="students-list-year_start">{{stud.yearStart}}</span>
                <span class="students-list-year_end">{{stud.yearEnd}}</span>
                <span class="students-list-budg">{{stud.budget}}</span>
                <span class="students-list-scsh">{{stud.scholarship}}</span>
            </a>
            <div (click)="showModal(stud._id, rm_stud)">&times;</div>
        </div>
    </div>
</div>

<div id="remove_stud" class="modal" #rm_stud>
    <div class="modal-content">
        <h4>You are deleting student</h4>
        <p>Are you sure ?</p>
    </div>
    <div class="modal-footer">
        <button (click)="removeStudent(studForRemove)" class="modal-close waves-effect waves-green btn-flat">Agree</button>
    </div>
</div>
